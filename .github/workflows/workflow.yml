# WizardCore CI
# ==========================================================================================
# Builds on every push to staging to verify the library compiles.
# Validates tags to enforce version ordering.
# ==========================================================================================

name: WizardCore CI

on:
  push:
    branches:
      - staging
    tags:
      - 'v*'

jobs:

  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config Release

    - name: Run Tests
      run: |
        echo "TODO: Insert test runner here"

    # Tag-only: verify new version is greater than all existing tags
    # ==========================================================================================
    - name: Verify Tag Version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        NEW_VERSION="${GITHUB_REF#refs/tags/v}"
        git fetch --prune --tags --force
        CURRENT_TAGS=$(git tag -l "v*" | sed 's/^v//' | sort -V)

        if [ -z "$CURRENT_TAGS" ]; then
          echo "✓ First tag in repository"
          exit 0
        fi

        HIGHEST_VERSION=$(echo "$CURRENT_TAGS" | tail -n 1)
        echo "New: $NEW_VERSION  Highest existing: $HIGHEST_VERSION"

        if [ "$(printf "%s\n" "$HIGHEST_VERSION" "$NEW_VERSION" | sort -V | tail -n 1)" != "$NEW_VERSION" ]; then
          echo "::error::Tag $NEW_VERSION is not greater than existing highest $HIGHEST_VERSION"
          exit 1
        fi

        echo "✓ Version $NEW_VERSION is valid"
